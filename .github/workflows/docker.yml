# Pinned action SHAs. Update via Dependabot github-actions PRs, then refresh comments.
# actions/checkout@v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
# docker/setup-qemu-action@v4.2.0 -> 96fe6ef7f33517b61c61be40b68a1882f3264fb8
# docker/setup-buildx-action@v4.2.0 -> bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
# docker/login-action@v4.6.0 -> dbcb813823bdd20940b903addbd779551569679f
# docker/metadata-action@v6.2.0 -> dc802804100637a589fabce1cb79ff13a1411302
# docker/build-push-action@v7.3.0 -> 53b7df96c91f9c12dcc8a07bcb9ccacbed38856a

name: Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - Dockerfile
      - docker/**
      - scripts/ci-smoke.sh
      - scripts/install-trivy.sh
      - scripts/trivy-scan.sh
      - docker-compose.yml
      - .dockerignore
      - .github/workflows/docker.yml
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - docker/**
      - scripts/ci-smoke.sh
      - scripts/install-trivy.sh
      - scripts/trivy-scan.sh
      - docker-compose.yml
      - .dockerignore
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: smelterworks/vs-dockerized-server
  SMOKE_IMAGE: smelterworks/vs-dockerized-server:smoke

jobs:
  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image_size: ${{ steps.badge_meta.outputs.size }}
      vs_version: ${{ steps.badge_meta.outputs.vs_version }}
      trivy_summary: ${{ steps.trivy.outputs.summary }}
      trivy_count: ${{ steps.trivy.outputs.count }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build smoke image
        env:
          OCI_VERSION: ${{ github.ref_name }}
          OCI_REVISION: ${{ github.sha }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: |
            OCI_VERSION=${{ env.OCI_VERSION }}
            OCI_REVISION=${{ env.OCI_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Badge metadata
        id: badge_meta
        run: |
          echo "size=$(docker images --format '{{.Size}}' "${{ env.SMOKE_IMAGE }}")" >> "$GITHUB_OUTPUT"
          echo "vs_version=$(grep '^ARG VS_VERSION=' Dockerfile | head -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Trivy
        run: |
          chmod 755 scripts/install-trivy.sh
          ./scripts/install-trivy.sh

      - name: Scan image with Trivy
        id: trivy
        env:
          SMOKE_IMAGE: ${{ env.SMOKE_IMAGE }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          chmod 755 scripts/trivy-scan.sh
          ./scripts/trivy-scan.sh

      - name: Run smoke test
        env:
          SMOKE_IMAGE: ${{ env.SMOKE_IMAGE }}
        run: |
          chmod 755 scripts/ci-smoke.sh
          ./scripts/ci-smoke.sh

  publish:
    name: Build and publish
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr

      - name: Build and push
        env:
          OCI_VERSION: ${{ github.ref_name }}
          OCI_REVISION: ${{ github.sha }}
          PUSH_IMAGE: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: ${{ env.PUSH_IMAGE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_VERSION=${{ env.OCI_VERSION }}
            OCI_REVISION=${{ env.OCI_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: ${{ env.PUSH_IMAGE }}
          sbom: ${{ env.PUSH_IMAGE }}

  badges:
    name: Update badges
    needs: [smoke, publish]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-badges.yml
    with:
      image_size: ${{ needs.smoke.outputs.image_size }}
      vs_version: ${{ needs.smoke.outputs.vs_version }}
      trivy_summary: ${{ needs.smoke.outputs.trivy_summary }}
      trivy_count: ${{ needs.smoke.outputs.trivy_count }}
